<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블로그 운영 현황 보고서 v2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --p:#1652F0; --p2:#3B82F6; --p3:#DBEAFE; --p4:#0F3CC9;
  --bg:#F0F5FF; --card:#fff; --border:#E2E8F0;
  --tx:#0F172A; --tm:#64748B; --tl:#94A3B8;
  --g:#10B981; --gb:#D1FAE5;
  --r:#EF4444; --rb:#FEE2E2;
  --o:#F59E0B; --ob:#FEF3C7;
  --pu:#8B5CF6; --pub:#EDE9FE;
  --au:#6366F1; --aub:#EEF2FF;
  --s1:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --s2:0 4px 16px rgba(22,82,240,.08),0 1px 4px rgba(0,0,0,.04);
  --s3:0 12px 40px rgba(22,82,240,.12),0 4px 12px rgba(0,0,0,.06);
  --rad:16px; --rad2:10px; --rad3:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.6}

/* ── PASSWORD ── */
#overlay{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#0A2D9E,#1652F0 50%,#3B82F6);display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#overlay.off{opacity:0;pointer-events:none}
.pwbox{background:#fff;border-radius:24px;padding:52px 44px 44px;width:100%;max-width:400px;text-align:center;animation:up .5s ease;box-shadow:0 32px 80px rgba(0,0,0,.25)}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.pwlogo{width:68px;height:68px;background:linear-gradient(135deg,#1652F0,#3B82F6);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;box-shadow:0 8px 24px rgba(22,82,240,.32)}
.pwlogo svg{width:34px;height:34px;fill:#fff}
.pwbox h2{font-size:22px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px}
.pwbox p{font-size:13px;color:var(--tm);font-weight:500;margin-bottom:28px}
.pw-wrap{position:relative;margin-bottom:12px}
.pw-wrap input{width:100%;height:52px;border:2px solid var(--border);border-radius:12px;padding:0 50px 0 18px;font-size:20px;font-weight:800;letter-spacing:6px;font-family:inherit;outline:none;background:#F8FAFF;transition:border-color .2s}
.pw-wrap input:focus{border-color:var(--p);background:#fff}
.pw-wrap input.err{border-color:var(--r);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pw-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--tl)}
.pw-err{color:var(--r);font-size:12px;font-weight:700;min-height:18px;margin-bottom:10px}
.pwbtn{width:100%;height:52px;background:linear-gradient(135deg,#1652F0,#3B82F6);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(22,82,240,.3);transition:all .2s}
.pwbtn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(22,82,240,.4)}

/* ── TOPBAR ── */
#app{display:none}
#app.on{display:block}
.topbar{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(22,82,240,.06)}
.tb-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;padding:0 24px;height:62px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-ic{width:36px;height:36px;background:linear-gradient(135deg,#1652F0,#3B82F6);border-radius:10px;display:flex;align-items:center;justify-content:center}
.brand-ic svg{width:18px;height:18px;fill:#fff}
.brand h1{font-size:15px;font-weight:900;letter-spacing:-.3px}
.brand span{font-size:11px;color:var(--tm);font-weight:600}
.tb-search{flex:1;max-width:280px;position:relative}
.tb-search input{width:100%;height:38px;border:1.5px solid var(--border);border-radius:20px;padding:0 16px 0 36px;font-size:13px;font-family:inherit;font-weight:500;outline:none;background:var(--bg);transition:all .2s}
.tb-search input:focus{border-color:var(--p);background:#fff;box-shadow:0 0 0 3px rgba(22,82,240,.08)}
.tb-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tl)}
.tb-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.live-dot{display:flex;align-items:center;gap:6px;background:var(--p3);color:var(--p);font-size:11px;font-weight:800;padding:5px 12px;border-radius:20px}
.live-dot i{width:6px;height:6px;background:var(--p);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
.tbtn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:none;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s}
.tbtn-blue{background:var(--p);color:#fff}
.tbtn-blue:hover{background:var(--p4)}
.tbtn-ghost{background:#fff;color:var(--tx);border:1.5px solid var(--border)}
.tbtn-ghost:hover{border-color:var(--p);color:var(--p)}
.tbtn-danger{background:#fff;color:var(--tm);border:1.5px solid var(--border)}
.tbtn-danger:hover{border-color:var(--r);color:var(--r)}
.tbtn svg{width:13px;height:13px}
.pw-toggle-all{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--tm);cursor:pointer;padding:6px 10px;border-radius:6px;border:1.5px solid var(--border);background:#fff;transition:all .2s}
.pw-toggle-all:hover{color:var(--p);border-color:var(--p)}

/* ── PAGE ── */
.page{max-width:1440px;margin:0 auto;padding:24px 24px 60px}

/* ── STAT CARDS ── */
.stat-row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:22px}
.scard{background:#fff;border-radius:var(--rad);padding:18px 18px 16px;box-shadow:var(--s1);border:1px solid rgba(226,232,240,.8);position:relative;overflow:hidden;transition:all .2s;cursor:default}
.scard::after{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.scard.c-blue::after{background:linear-gradient(90deg,var(--p),var(--p2))}
.scard.c-green::after{background:linear-gradient(90deg,#10B981,#34D399)}
.scard.c-red::after{background:linear-gradient(90deg,#EF4444,#F87171)}
.scard.c-orange::after{background:linear-gradient(90deg,#F59E0B,#FCD34D)}
.scard.c-purple::after{background:linear-gradient(90deg,#8B5CF6,#A78BFA)}
.scard.c-indigo::after{background:linear-gradient(90deg,#6366F1,#818CF8)}
.scard:hover{transform:translateY(-2px);box-shadow:var(--s2)}
.scard-ico{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.scard-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--tm);margin-bottom:7px}
.scard-val{font-size:26px;font-weight:900;letter-spacing:-1px;line-height:1}
.scard-val em{font-size:13px;font-weight:600;color:var(--tm);font-style:normal}
.scard-sub{font-size:11px;font-weight:700;margin-top:5px}

/* ── SECTION HEADER ── */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.sec-left{display:flex;align-items:center;gap:10px}
.sec-title{font-size:17px;font-weight:900;letter-spacing:-.4px}
.sec-badge{background:var(--p3);color:var(--p);font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px}

/* ── TWO COL CHARTS ── */
.chart-row{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-bottom:22px}
.chart-card{background:#fff;border-radius:var(--rad);padding:22px;box-shadow:var(--s1);border:1px solid var(--border)}
.chart-title{font-size:15px;font-weight:800;letter-spacing:-.3px;margin-bottom:3px}
.chart-sub{font-size:11px;font-weight:500;color:var(--tm);margin-bottom:18px}

/* Bar chart */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-lbl{font-size:11px;font-weight:700;color:var(--tx);width:56px;flex-shrink:0}
.bar-track{flex:1;height:26px;background:#F1F5F9;border-radius:7px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--p),var(--p2));display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:800;color:#fff;transition:width 1s cubic-bezier(.4,0,.2,1);min-width:24px;position:relative}
.bar-fill.has-auto::after{content:'🤖';position:absolute;right:4px;font-size:9px}
.bar-num{font-size:12px;font-weight:800;color:var(--tx);width:28px;text-align:right;flex-shrink:0}
.bar-trend{font-size:10px;font-weight:700;width:28px;text-align:right;flex-shrink:0}
.up{color:var(--g)} .dn{color:var(--r)} .eq{color:var(--tl)}

/* Person grid */
.person-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pc{display:flex;align-items:center;gap:10px;background:#F8FAFF;border-radius:var(--rad2);padding:11px 13px;transition:all .2s}
.pc:hover{background:#EFF6FF}
.pc-ava{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.pc-info .name{font-size:12px;font-weight:800;color:var(--tx)}
.pc-info .cnt{font-size:19px;font-weight:900;color:var(--p);line-height:1.1}
.pc-info .sub{font-size:10px;font-weight:600;color:var(--tm)}

/* ── 3 COL SUMMARY ── */
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:22px}
.sum-card{background:#fff;border-radius:var(--rad);padding:20px;box-shadow:var(--s1);border:1px solid var(--border)}
.sum-card h4{font-size:13px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.sum-list{display:flex;flex-direction:column;gap:7px}
.sum-item{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;background:#F8FAFF;border-radius:7px}
.sum-lbl{font-size:12px;font-weight:600;color:var(--tm)}
.sum-val{font-size:13px;font-weight:800;color:var(--tx)}
.sum-link{color:var(--p);font-size:11px;font-weight:700;text-decoration:none}
.sum-link:hover{text-decoration:underline}

/* Issue bar */
.issue-bar{display:flex;gap:8px;margin-bottom:22px;background:#fff;border-radius:var(--rad);padding:16px 20px;box-shadow:var(--s1);border:1px solid var(--border);align-items:center;flex-wrap:wrap}
.issue-lbl{font-size:12px;font-weight:800;color:var(--tm);margin-right:4px}
.issue-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700}
.ic-cut{background:#FEE2E2;color:#991B1B}
.ic-acct{background:#FEF3C7;color:#92400E}
.ic-priv{background:var(--pub);color:#5B21B6}
.ic-ok{background:var(--gb);color:#065F46}
.issue-chip .dot{width:6px;height:6px;border-radius:50%}
.ic-cut .dot{background:var(--r)} .ic-acct .dot{background:var(--o)} .ic-priv .dot{background:var(--pu)} .ic-ok .dot{background:var(--g)}

/* ── DATE TABS ── */
.date-tabs{display:flex;gap:6px;flex-wrap:wrap;background:#fff;padding:8px;border-radius:var(--rad);box-shadow:var(--s1);border:1px solid var(--border);margin-bottom:16px}
.dtab{padding:7px 16px;border-radius:var(--rad2);border:none;background:transparent;font-size:12px;font-weight:700;font-family:inherit;color:var(--tm);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.dtab:hover{background:var(--bg);color:var(--tx)}
.dtab.on{background:var(--p);color:#fff;box-shadow:0 3px 10px rgba(22,82,240,.28)}
.dtab .c{font-size:10px;font-weight:800;padding:1px 6px;border-radius:9px}
.dtab.on .c{background:rgba(255,255,255,.22);color:#fff}
.dtab:not(.on) .c{background:var(--bg);color:var(--tl)}
.dtab.sep{padding-right:20px;border-right:1px solid var(--border);margin-right:4px}

/* ── FILTER BAR ── */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.fl{font-size:11px;font-weight:800;color:var(--tm)}
.fbtn{padding:5px 13px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s;color:var(--tm)}
.fbtn:hover{border-color:var(--p);color:var(--p)}
.fbtn.on{background:var(--p);border-color:var(--p);color:#fff}
.sort-wrap{margin-left:auto;display:flex;align-items:center;gap:7px}
.sort-wrap label{font-size:11px;font-weight:700;color:var(--tm)}
.sort-wrap select{border:1.5px solid var(--border);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;font-family:inherit;color:var(--tx);outline:none;background:#fff;cursor:pointer;transition:border-color .2s}
.sort-wrap select:focus{border-color:var(--p)}
.f-info{font-size:11px;font-weight:600;color:var(--tl)}

/* ── TABLE ── */
.tbl-wrap{background:#fff;border-radius:var(--rad);box-shadow:var(--s1);border:1px solid var(--border);overflow:hidden;margin-bottom:22px}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:1060px}
thead tr{background:linear-gradient(90deg,#F8FAFF,#EFF6FF)}
thead th{padding:11px 14px;font-size:10px;font-weight:800;color:var(--tm);text-align:left;border-bottom:1.5px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
tbody tr{border-bottom:1px solid rgba(226,232,240,.5);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#F8FAFF}
tbody tr.auto-tr{background:#FAFAFF}
tbody tr.auto-tr:hover{background:#F0F4FF}
tbody td{padding:10px 14px;font-size:12px;font-weight:500;color:var(--tx);vertical-align:middle}

/* row num */
.rn{font-size:10px;font-weight:800;color:var(--tl);background:#F1F5F9;width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center}

/* link cell */
.link-cell{display:flex;align-items:center;gap:6px;min-width:200px;max-width:240px}
.link-cell a{color:var(--p);font-size:11px;font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;transition:color .15s}
.link-cell a:hover{color:var(--p4);text-decoration:underline}
.ic-btn{width:22px;height:22px;border-radius:5px;border:none;background:var(--p3);color:var(--p);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.ic-btn:hover{background:var(--p);color:#fff}
.ic-btn svg{width:10px;height:10px}

/* kw badge */
.kw{display:inline-flex;align-items:center;background:linear-gradient(135deg,#EFF6FF,#DBEAFE);color:#1E3A8A;border:1px solid #BFDBFE;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap}

/* person avatar */
.pava{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:10px;font-weight:800}
.p-민수{background:#DBEAFE;color:#1D4ED8}
.p-지운{background:#D1FAE5;color:#065F46}
.p-창희{background:#FEF3C7;color:#92400E}
.p-민균{background:#EDE9FE;color:#5B21B6}
.p-현빈{background:#FCE7F3;color:#9D174D}

/* account cell */
.acct{min-width:170px}
.acct-id{font-size:11px;font-weight:800;color:var(--tx);margin-bottom:3px;display:flex;align-items:center;gap:4px}
.acct-pw-row{display:flex;align-items:center;gap:4px}
.pw-text{font-size:11px;font-weight:700;color:var(--tm);font-family:'Courier New',monospace;background:#F1F5F9;padding:2px 7px;border-radius:5px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-text.hidden span{filter:blur(4px)}
.copy-btn{width:18px;height:18px;border-radius:4px;border:none;background:#E2E8F0;color:var(--tm);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.copy-btn:hover{background:var(--p);color:#fff}
.copy-btn svg{width:9px;height:9px}

/* status badges */
.sbadge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap}
.sbadge::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.s-ok{background:var(--gb);color:#065F46}
.s-ok::before{background:var(--g)}
.s-no{background:var(--rb);color:#991B1B}
.s-no::before{background:var(--r)}
.s-acct-ok{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0}
.s-acct-ok::before{background:#34D399}
.s-acct-no{background:#FFF7ED;color:#92400E;border:1px solid #FED7AA}
.s-acct-no::before{background:#FB923C}

/* issue tags */
.issue-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.itag{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px}
.it-cut{background:#FEE2E2;color:#B91C1C}
.it-acct{background:#FEF3C7;color:#B45309}
.it-priv{background:var(--pub);color:#7C3AED}

/* rank tag */
.rank-tag{font-size:10px;font-weight:800;color:var(--tx);background:#F1F5F9;padding:3px 8px;border-radius:5px;border-left:2px solid var(--p);white-space:nowrap}
.rank-tag.p1{background:#FEF9C3;color:#92400E;border-left-color:#F59E0B}

/* auto badge */
.auto-badge{display:inline-flex;align-items:center;gap:4px;background:var(--aub);color:var(--au);border:1px solid #C7D2FE;font-size:10px;font-weight:800;padding:3px 8px;border-radius:7px}
.auto-badge svg{width:10px;height:10px}
.manual-lbl{font-size:10px;font-weight:600;color:var(--tl)}

/* ── RANKING WALL ── */
.rank-wall{background:#fff;border-radius:var(--rad);padding:22px;box-shadow:var(--s1);border:1px solid var(--border);margin-bottom:22px}
.rank-wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:14px}
.rwall-item{display:flex;align-items:flex-start;gap:10px;background:linear-gradient(135deg,#FEFCE8,#FEF9C3);border:1px solid #FDE68A;border-radius:var(--rad2);padding:12px;transition:all .2s}
.rwall-item:hover{transform:translateY(-1px);box-shadow:var(--s2)}
.rwall-num{width:28px;height:28px;border-radius:8px;background:#F59E0B;color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rwall-info .kw2{font-size:12px;font-weight:800;color:var(--tx)}
.rwall-info .meta{font-size:10px;font-weight:600;color:var(--tm);margin-top:2px}
.rwall-info a{color:var(--p);font-size:10px;font-weight:700;text-decoration:none}
.rwall-info a:hover{text-decoration:underline}
.rwall-info .badges{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}

/* ── ACCOUNT HEALTH ── */
.acct-health{background:#fff;border-radius:var(--rad);padding:22px;box-shadow:var(--s1);border:1px solid var(--border);margin-bottom:22px}
.health-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px}
.hcard{background:#F8FAFF;border-radius:var(--rad2);padding:12px 14px;border:1px solid var(--border);transition:all .2s}
.hcard:hover{border-color:var(--p2);background:#EFF6FF}
.hcard-id{font-size:12px;font-weight:800;color:var(--tx);margin-bottom:2px}
.hcard-owner{font-size:10px;font-weight:600;color:var(--tm);margin-bottom:8px}
.hcard-bars{display:flex;flex-direction:column;gap:4px}
.hbar-row{display:flex;align-items:center;gap:6px}
.hbar-lbl{font-size:9px;font-weight:700;color:var(--tm);width:28px}
.hbar-track{flex:1;height:6px;background:#E2E8F0;border-radius:4px;overflow:hidden}
.hbar-fill{height:100%;border-radius:4px;transition:width .8s}
.hbar-fill.ok{background:var(--g)}
.hbar-fill.cut{background:var(--r)}
.hcard-stat{display:flex;gap:6px;margin-top:8px}
.hstat{font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px}
.hstat.ok{background:var(--gb);color:#065F46}
.hstat.cut{background:var(--rb);color:#991B1B}
.hstat.acct{background:var(--ob);color:#92400E}

/* ── KW SECTION ── */
.kw-section{background:#fff;border-radius:var(--rad);padding:22px;box-shadow:var(--s1);border:1px solid var(--border)}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:14px}
.kw-item{display:flex;align-items:center;justify-content:space-between;background:#F8FAFF;border-radius:var(--rad2);padding:9px 12px;border:1px solid transparent;transition:all .15s;gap:8px}
.kw-item:hover{background:#EFF6FF;border-color:#BFDBFE}
.kw-name{font-size:11px;font-weight:700;color:var(--tx)}
.kw-blog{font-size:9px;font-weight:700;color:var(--pu);background:var(--pub);padding:2px 6px;border-radius:5px;margin-top:3px;display:inline-block}
.kw-rank{font-size:11px;font-weight:900;padding:3px 8px;border-radius:8px;white-space:nowrap}
.kr-1{background:#FEF9C3;color:#92400E}
.kr-2{background:#DBEAFE;color:#1D4ED8}
.kr-3{background:#D1FAE5;color:#065F46}
.kr-n{background:#F1F5F9;color:var(--tm);border:1px solid var(--border)}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;right:28px;background:#1E293B;color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:9000;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.on{opacity:1;transform:translateY(0)}

/* ── PROGRESS ── */
.prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--p),var(--p2));z-index:9998;width:0;transition:width .8s ease}

/* ── EMPTY ── */
.empty{text-align:center;padding:48px 20px;color:var(--tl)}
.empty svg{width:44px;height:44px;margin-bottom:10px;opacity:.25}
.empty p{font-size:13px;font-weight:600}

/* ── PRINT STYLES ── */
@media print{
  .topbar,.date-tabs,.filter-bar,#overlay,.prog,.toast,.tbtn,.fbtn,.copy-btn,.ic-btn,.pw-toggle-all{display:none!important}
  body{background:#fff}
  .scard,.chart-card,.sum-card,.tbl-wrap,.rank-wall,.acct-health,.kw-section{box-shadow:none!important;border:1px solid #ddd!important;break-inside:avoid}
  .stat-row{grid-template-columns:repeat(3,1fr)}
  .chart-row,.sum3{grid-template-columns:1fr 1fr}
}

/* ── RESPONSIVE ── */
@media(max-width:1200px){
  .stat-row{grid-template-columns:repeat(3,1fr)}
  .chart-row{grid-template-columns:1fr}
  .sum3{grid-template-columns:1fr 1fr}
}
@media(max-width:900px){
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .sum3{grid-template-columns:1fr}
  .tb-in{padding:0 14px;gap:10px}
  .page{padding:16px 14px 40px}
  .tb-search{max-width:180px}
  .brand span{display:none}
  .person-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:620px){
  .stat-row{grid-template-columns:1fr 1fr}
  .tb-search{display:none}
  .live-dot{display:none}
  .brand h1{font-size:13px}
  .scard-val{font-size:20px}
  .dtab .lbl{display:none}
  .health-grid{grid-template-columns:1fr 1fr}
  .kw-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:420px){
  .stat-row{grid-template-columns:1fr}
  .health-grid{grid-template-columns:1fr}
}

function animateCounters(){
  document.querySelectorAll('[data-target]').forEach(el=>{
    const t=+el.dataset.target, em=el.querySelector('em')?.outerHTML||'';
    let s=0,d=Math.ceil(t/30);
    const ti=setInterval(()=>{
      s+=d; if(s>=t){s=t;clearInterval(ti);}
      el.innerHTML=s+em;
    },30);
  });
}

// ═══════════════════════ CHARTS ═══════════════════════
function renderCharts(){
  const cnts=DATES.map(d=>F(r=>r[0]===d).length);
  const mx=Math.max(...cnts);
  document.getElementById('bars').innerHTML=DATES.map((d,i)=>{
    const cnt=cnts[i], prev=i>0?cnts[i-1]:cnt;
    const pct=Math.round(cnt/mx*100);
    const aCnt=F(r=>r[0]===d&&isAuto(r)).length;
    const diff=i===0?0:cnt-prev;
    const trendHtml=i===0?`<span class="eq">—</span>`:diff>0?`<span class="up">↑${diff}</span>`:diff<0?`<span class="dn">↓${Math.abs(diff)}</span>`:`<span class="eq">—</span>`;
    return `<div class="bar-row">
      <div class="bar-lbl">${d.replace('04/','4월')}</div>
      <div class="bar-track"><div class="bar-fill${aCnt?' has-auto':''}" style="width:${pct}%">${cnt}</div></div>
      <div class="bar-num">${cnt}</div>
      <div class="bar-trend">${trendHtml}</div>
    </div>`;
  }).join('');

  const persons=['민수','지운','창희','민균','현빈'];
  document.getElementById('personGrid').innerHTML=persons.map(p=>{
    const rows=F(r=>r[3]===p);
    const cnt=rows.length, okCnt=rows.filter(isOk).length, cutCnt=rows.filter(isCutAny).length;
    const [bg,cl]=PCOLOR[p]||['#F1F5F9','#475569'];
    return `<div class="pc">
      <div class="pc-ava" style="background:${bg};color:${cl}">${PEMO[p]||p[0]}</div>
      <div class="pc-info">
        <div class="name">${p}</div>
        <div class="cnt">${cnt}<span style="font-size:11px;font-weight:600;color:var(--tm)">건</span></div>
        <div class="sub">노출 ${okCnt} · 짤림 ${cutCnt}</div>
      </div>
    </div>`;
  }).join('');
}

function setDate(d){curDate=d;renderDateTabs();applyF();}
function setSF(btn,f){sf=f;document.querySelectorAll('[data-sf]').forEach(b=>b.classList.remove('on'));btn.classList.add('on');applyF();}

// ═══════════════════════ FILTER + RENDER TABLE ═══════════════════════
function applyF(){
  let rows=curDate==='all'?[...D]:D.filter(r=>r[0]===curDate);
  const q=(document.getElementById('srch')?.value||'').toLowerCase();
  if(q) rows=rows.filter(r=>r[2].toLowerCase().includes(q)||r[4].toLowerCase().includes(q)||r[1].toLowerCase().includes(q)||r[3].toLowerCase().includes(q));
  if(sf==='ok') rows=rows.filter(isOk);
  else if(sf==='no') rows=rows.filter(isNo);
  else if(sf==='cut') rows=rows.filter(isCutAny);
  else if(sf==='acctcut') rows=rows.filter(isAcct);
  else if(sf==='priv') rows=rows.filter(isPriv);
  else if(sf==='auto') rows=rows.filter(isAuto);
  const s=document.getElementById('sortSel')?.value||'';
  if(s==='person') rows=[...rows].sort((a,b)=>a[3].localeCompare(b[3]));
  else if(s==='keyword') rows=[...rows].sort((a,b)=>a[2].localeCompare(b[2]));
  else if(s==='status') rows=[...rows].sort((a,b)=>a[6].localeCompare(b[6]));
  else if(s==='auto') rows=[...rows].sort((a,b)=>b[9]-a[9]);
  document.getElementById('tblCnt').textContent=rows.length+'건';
  document.getElementById('fInfo').textContent=rows.length===D.length?'전체 표시 중':`${rows.length}건 필터됨`;
  renderTable(rows);
}

function buildIssueTags(issue){
  if(!issue) return '';
  let out='';
  if(issue.includes('cut')) out+=`<span class="itag it-cut">✂️글짤림</span>`;
  if(issue.includes('acct')) out+=`<span class="itag it-acct">⚠️계정짤림</span>`;
  if(issue.includes('priv')) out+=`<span class="itag it-priv">🔒비공개</span>`;
  return out;
}

function renderTable(rows){
  const tb=document.getElementById('tbody');
  if(!rows.length){
    tb.innerHTML=`<tr><td colspan="9"><div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p>검색 결과가 없습니다</p></div></td></tr>`;
    return;
  }
  tb.innerHTML=rows.map((r,i)=>{
    const [bg,cl]=PCOLOR[r[3]]||['#F1F5F9','#475569'];
    const urlShort=r[1].replace('https://blog.naver.com/','').slice(0,36);
    const sCls=r[6]==='ok'?'s-ok':r[6]==='no'?'s-no':r[6]==='acct-ok'?'s-acct-ok':'s-acct-no';
    const sLabel=r[6]==='ok'?'노출중':r[6]==='no'?'미노출':r[6]==='acct-ok'?'계정 노출중':'계정 미노출';
    const rankHtml=r[8]?`<span class="rank-tag${r[8].includes('1번째')?' p1':''}">${r[8]}</span>`:'—';
    const issueTags=buildIssueTags(r[7]);
    const pwDisplay=pwHidden?'•••••••':r[5];
    return `<tr class="${r[9]?'auto-tr':''}">
      <td><div class="rn">${i+1}</div></td>
      <td>
        <div class="link-cell">
          <a href="${r[1]}" target="_blank" rel="noopener" title="${r[1]}">${urlShort}…</a>
          <button class="ic-btn" onclick="doCopy('${r[1]}',this)" title="URL 복사">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </button>
        </div>
      </td>
      <td><span class="kw">${r[2]}</span></td>
      <td><span class="pava p-${r[3]}">${r[3]}</span></td>
      <td class="acct">
        <div class="acct-id">${r[4]}</div>
        <div class="acct-pw-row">
          <span class="pw-text" title="${r[5]}">${pwDisplay}</span>
          <button class="copy-btn" onclick="doCopy('${r[5]}',this)" title="비밀번호 복사">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          </button>
        </div>
      </td>
      <td><span class="sbadge ${sCls}">${sLabel}</span></td>
      <td>${issueTags||'<span style="color:var(--tl);font-size:10px">없음</span>'}</td>
      <td>${rankHtml}</td>
      <td>${r[9]?`<span class="auto-badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>자동화</span>`:`<span class="manual-lbl">일반</span>`}</td>
    </tr>`;
  }).join('');
}

// ═══════════════════════ COPY ═══════════════════════
function doCopy(text,btn){
  navigator.clipboard.writeText(text).then(()=>{
    showToast('📋 클립보드에 복사되었습니다!');
    const orig=btn.innerHTML;
    btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
    btn.style.background='var(--g)';btn.style.color='#fff';
    setTimeout(()=>{btn.innerHTML=orig;btn.style.background='';btn.style.color='';},1500);
  }).catch(()=>showToast('복사 실패. 수동으로 복사해주세요.'));
}

// ═══════════════════════ EXPORT ═══════════════════════
function doExport(){
  let rows=curDate==='all'?[...D]:D.filter(r=>r[0]===curDate);
  const hdr=['날짜','URL','키워드','담당자','계정ID','비밀번호','노출상태','이슈','순위/비고','구분'];
  const csv=[hdr,...rows.map(r=>[r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7],r[8],r[9]?'자동화':'일반'])]
    .map(row=>row.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`블로그_보고서_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('✅ CSV 파일 다운로드 완료!');
}

// ═══════════════════════ TOAST ═══════════════════════
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2600);
}
